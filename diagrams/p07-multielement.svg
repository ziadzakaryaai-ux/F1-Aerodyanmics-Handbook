<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Helvetica, sans-serif" font-size="12.5">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f6feb"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5f6368"/></marker>
  </defs>
  <rect width="940" height="420" fill="white"/>
  <text x="40" y="32" font-weight="bold" font-size="14">Multi-element downforce wing: why slots matter</text>

  <!-- main plane (inverted, camber side down) -->
  <path d="M120,190 Q300,230 480,205 L480,215 Q300,242 120,202 Z" fill="#202124"/>
  <!-- flap -->
  <path d="M400,195 Q560,160 640,120 L648,130 Q568,172 405,207 Z" fill="#3c4043"/>
  <!-- cove region shaded -->
  <path d="M395,208 Q430,235 400,205 Z" fill="#fdd663" opacity="0.9"/>
  <circle cx="408" cy="216" r="5" fill="#b06000"/>
  <text x="330" y="250" fill="#b06000" font-weight="bold">cove: high-pressure stagnation region</text>
  <!-- slot jet -->
  <path d="M415,213 Q470,190 520,180" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M420,200 Q480,175 540,163" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#ab)" opacity="0.75"/>
  <text x="452" y="145" fill="#1f6feb" font-weight="bold">slot jet: high-momentum air from the cove</text>
  <text x="452" y="161" fill="#1f6feb">feeds the next element's boundary layer</text>
  <!-- flow over top -->
  <path d="M130,150 Q320,120 430,140" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ak)"/>
  <path d="M130,110 Q330,70 500,105" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ak)"/>
  <text x="150" y="95" fill="#5f6368">free-stream flow</text>
  <!-- separated alternative -->
  <path d="M560,150 Q600,175 620,220" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="630" y="235" fill="#d93025" font-size="11">without the slot, the flap's boundary layer</text>
  <text x="630" y="250" fill="#d93025" font-size="11">separates early → lost load, stall</text>

  <!-- takeaway -->
  <rect x="40" y="300" width="860" height="100" rx="8" fill="#eef3fb" stroke="#1f6feb" stroke-width="1"/>
  <text x="55" y="325" font-weight="bold">The physics of multi-element wings is boundary-layer management, not "more Bernoulli":</text>
  <text x="55" y="346">1. The pressure difference between cove and main surface drives air through the slot (continuity + momentum).</text>
  <text x="55" y="364">2. That jet adds momentum to the flap's boundary layer, delaying separation (Part II).</text>
  <text x="55" y="382">3. Each element then works at a higher effective load — the elements also interact (cascade), so total circulation exceeds any single element.</text>
</svg>
